data-source-line="35"><rect x="251.638" y="386.297" width="152.323" height="35.133" fill="#E6E1D8" style="stroke:#6E675D;stroke-width:0.5;" rx="3" ry="3"/><text x="261.638" y="408.364" fill="#14120F" font-size="13" textLength="132.323" font-family="Helvetica">DOORS  (open here)</text></g><!--entity bl--><g class="entity" data-qualified-name="car.bl" id="ent0002" data-source-line="22"><rect x="118.138" y="83.297" width="120.528" height="65.398" fill="#DCEBDF" style="stroke:#6E675D;stroke-width:0.5;" rx="3" ry="3"/><text x="128.138" y="105.364" fill="#14120F" font-size="13" textLength="87.09" font-weight="700" font-family="Helvetica">Back corner</text><text x="128.138" y="120.497" fill="#14120F" font-size="13" textLength="100.528" font-family="Helvetica">Going furthest?</text><text x="128.138" y="135.629" fill="#14120F" font-size="13" textLength="98.109" font-family="Helvetica">Move here first</text></g><!--entity bc--><g class="entity" data-qualified-name="car.bc" id="ent0003" data-source-line="23"><rect x="258.638" y="83.297" width="137.609" height="65.398" fill="#DCEBDF" style="stroke:#6E675D;stroke-width:0.5;" rx="3" ry="3"/><text x="268.638" y="105.364" fill="#14120F" font-size="13" textLength="69.253" font-weight="700" font-family="Helvetica">Back wall</text><text x="268.638" y="120.497" fill="#14120F" font-size="13" textLength="117.609" font-family="Helvetica">Fill from the back,</text><text x="268.638" y="135.629" fill="#14120F" font-size="13" textLength="93.564" font-family="Helvetica">face the doors</text></g><!--entity br--><g class="entity" data-qualified-name="car.br" id="ent0004" data-source-line="24"><rect x="415.138" y="83.297" width="120.528" height="65.398" fill="#DCEBDF" style="stroke:#6E675D;stroke-width:0.5;" rx="3" ry="3"/><text x="425.138" y="105.364" fill="#14120F" font-size="13" textLength="87.09" font-weight="700" font-family="Helvetica">Back corner</text><text x="425.138" y="120.497" fill="#14120F" font-size="13" textLength="100.528" font-family="Helvetica">Going furthest?</text><text x="425.138" y="135.629" fill="#14120F" font-size="13" textLength="98.109" font-family="Helvetica">Move here first</text></g><!--entity ml--><g class="entity" data-qualified-name="car.ml" id="ent0005" data-source-line="26"><rect x="108.638" y="184.297" width="140.479" height="65.398" fill="#DCEBDF" style="stroke:#6E675D;stroke-width:0.5;" rx="3" ry="3"/><text x="118.638" y="206.364" fill="#14120F" font-size="13" textLength="66.162" font-weight="700" font-family="Helvetica">Side wall</text><text x="118.638" y="221.497" fill="#14120F" font-size="13" textLength="118.612" font-family="Helvetica">Fill the sides next,</text><text x="118.638" y="236.629" fill="#14120F" font-size="13" textLength="120.479" font-family="Helvetica">bag in front of you</text></g><!--entity mc--><g class="entity" data-qualified-name="car.mc" id="ent0006" data-source-line="27"><rect x="266.638" y="184.297" width="121.829" height="65.398" fill="#F6E7C1" style="stroke:#6E675D;stroke-width:0.5;" rx="3" ry="3"/><text x="276.638" y="206.364" fill="#14120F" font-size="13" textLength="49.277" font-weight="700" font-family="Helvetica">Middle</text><text x="276.638" y="221.497" fill="#14120F" font-size="13" textLength="50.026" font-family="Helvetica">Fill last,</text><text x="276.638" y="236.629" fill="#14120F" font-size="13" textLength="101.829" font-family="Helvetica">only when busy</text></g><!--entity mr--><g class="entity" data-qualified-name="car.mr" id="ent0007" data-source-line="28"><rect x="406.638" y="184.297" width="140.479" height="65.398" fill="#DCEBDF" style="stroke:#6E675D;stroke-width:0.5;" rx="3" ry="3"/><text x="416.638" y="206.364" fill="#14120F" font-size="13" textLength="66.162" font-weight="700" font-family="Helvetica">Side wall</text><text x="416.638" y="221.497" fill="#14120F" font-size="13" textLength="118.612" font-family="Helvetica">Fill the sides next,</text><text x="416.638" y="236.629" fill="#14120F" font-size="13" textLength="120.479" font-family="Helvetica">bag in front of you</text></g><!--entity fl--><g class="entity" data-qualified-name="car.fl" id="ent0008" data-source-line="30"><rect x="77.638" y="285.297" width="131.56" height="65.398" fill="#F6E7C1" style="stroke:#6E675D;stroke-width:0.5;" rx="3" ry="3"/><text x="87.638" y="307.364" fill="#14120F" font-size="13" textLength="91.749" font-weight="700" font-family="Helvetica">Front corner</text><text x="87.638" y="322.497" fill="#14120F" font-size="13" textLength="111.56" font-family="Helvetica">Getting off soon?</text><text x="87.638" y="337.629" fill="#14120F" font-size="13" textLength="71.519" font-family="Helvetica">Stand here</text></g><!--entity fc--><g class="entity" data-qualified-name="car.fc" id="ent0009" data-source-line="31"><rect x="228.138" y="285.297" width="199.163" height="65.398" fill="#F4D3CF" style="stroke:#6E675D;stroke-width:0.5;" rx="3" ry="3"/><text x="238.138" y="307.364" fill="#14120F" font-size="13" textLength="74.16" font-weight="700" font-family="Helvetica">Door zone</text><text x="238.138" y="322.497" fill="#14120F" font-size="13" textLength="169.267" font-family="Helvetica">Keep clear. If you block it,</text><text x="238.138" y="337.629" fill="#14120F" font-size="13" textLength="179.163" font-family="Helvetica">step out to let people leave</text></g><!--entity fr--><g class="entity" data-qualified-name="car.fr" id="ent0010" data-source-line="32"><rect x="445.638" y="285.297" width="173.639" height="65.398" fill="#F6E7C1" style="stroke:#6E675D;stroke-width:0.5;" rx="3" ry="3"/><text x="455.638" y="307.364" fill="#14120F" font-size="13" textLength="94.91" font-weight="700" font-family="Helvetica">Button panel</text><text x="455.638" y="322.497" fill="#14120F" font-size="13" textLength="153.639" font-family="Helvetica">Nearest person presses</text><text x="455.638" y="337.629" fill="#14120F" font-size="13" textLength="103.759" font-family="Helvetica">floors for others</text></g><!--entity wl--><g class="entity" data-qualified-name="landing.wl" id="ent0013" data-source-line="38"><rect x="110.138" y="478.797" width="128.761" height="50.266" fill="#DCEBDF" style="stroke:#6E675D;stroke-width:0.5;" rx="3" ry="3"/><text x="120.138" y="500.864" fill="#14120F" font-size="13" textLength="71.608" font-weight="700" font-family="Helvetica">Wait here</text><text x="120.138" y="515.997" fill="#14120F" font-size="13" textLength="108.761" font-family="Helvetica">beside the doors</text></g><!--entity wc--><g class="entity" data-qualified-name="landing.wc" id="ent0014" data-source-line="39"><rect x="257.638" y="471.297" width="140.167" height="65.398" fill="#F4D3CF" style="stroke:#6E675D;stroke-width:0.5;" rx="3" ry="3"/><text x="267.638" y="493.364" fill="#14120F" font-size="13" textLength="66.009" font-weight="700" font-family="Helvetica">Exit path</text><text x="267.638" y="508.497" fill="#14120F" font-size="13" textLength="106.317" font-family="Helvetica">leave it clear for</text><text x="267.638" y="523.629" fill="#14120F" font-size="13" textLength="120.167" font-family="Helvetica">people getting out</text></g><!--entity wr--><g class="entity" data-qualified-name="landing.wr" id="ent0015" data-source-line="40"><rect x="416.138" y="478.797" width="128.761" height="50.266" fill="#DCEBDF" style="stroke:#6E675D;stroke-width:0.5;" rx="3" ry="3"/><text x="426.138" y="500.864" fill="#14120F" font-size="13" textLength="71.608" font-weight="700" font-family="Helvetica">Wait here</text><text x="426.138" y="515.997" fill="#14120F" font-size="13" textLength="108.761" font-family="Helvetica">beside the doors</text></g><g class="legend" data-source-line="61"><rect x="12" y="582.297" width="660.275" height="75.188" fill="#FAF8F4" style="stroke:#E6E1D8;stroke-width:1;" rx="3" ry="3"/><text x="17" y="600.292" fill="#000" font-size="14" textLength="13.351" font-family="Helvetica" filter="url(#bizrrc42f40bd0)">   </text><text x="34.801" y="600.292" fill="#000" font-size="14" textLength="200.983" font-family="Helvetica">Good places to stand or wait</text><text x="17" y="616.589" fill="#000" font-size="14" textLength="13.351" font-family="Helvetica" filter="url(#bizrrc42f40bd1)">   </text><text x="34.801" y="616.589" fill="#000" font-size="14" textLength="331.256" font-family="Helvetica">Use if you're getting off soon, or when it's busy</text><text x="17" y="632.886" fill="#000" font-size="14" textLength="13.351" font-family="Helvetica" filter="url(#bizrrc42f40bd2)">   </text><text x="34.801" y="632.886" fill="#000" font-size="14" textLength="278.913" font-family="Helvetica">Keep clear so people can get in and out</text><text x="17" y="649.183" fill="#000" font-size="14" textLength="650.275" font-family="Helvetica">Inside, fill the car from the back and sides first. Outside, let everyone out before you step in.</text></g><?plantuml-src hLPHRzis47xdhxYr3qu0nvtNp2sA84DgMscsDW6IjNrO1fIIJZ8HYXH8scewzB_lICgsRCN31imF1amUFtxttTr73o2HMXke9LUW2w1lbBZYZjOoRi0YAYYChe2dUeLl8ENP0pHSIk0Et0B1wNe8EM7OzKggdTFLY0tW5bME1dCAsi2U5Fx24t_XoAvAQ8HRm1TLLs2M2dB1IyCh-mME569kuLU-uiSZcEgg4iv3Bw0G4ks8_L0RNbOS97_KImUsGiSLPym-25Lp0WbSIwENAfzgIGazJyAd4v5ZmPVI9LgvQruXl4EvGYSo_dJCdVY6C7xPsRGBdkj6g18ABYrsTjfxZK83a-uwPiIpb0X_CO2tsf12BRt9VFBgvncj-hlQjV7f-ASV4_QzWo2n95tZyLw65ydhv7GVU3wPZsUl2OGvuUZcpmkgYY-A9Iev2BLJzwEzeXypjYNzRFv-_kdYzvjRc5xS0XmzrG_7pu3Rq3wjuiIrWt2MddlUa0Lnpbwav_VgKWSDbuOWhFlbNdsWYo7GB8InBY2c4fxFflEti-GfE4yYWYM2w0J-eHrfStYl2fvX-1rwDU9b_uJtt-cP3TmUtft8SP-Vfs9ftOB2huu8fhpqbI3UolbHfAuEiDMXh3-8F9VOWPJSUY2jv2Cq2wfXkhIF4OCoJIRpLzFn_yhiOC992DrH49tp6kgY0Akr8WtlGlDv4GDQ8Gzmd7c3-gPLc-flY3La4haPmLKWGusXgM32SxMEThqVK7TBT52ZhWc7mbVjDLwAqzdBQQ_eIx8j1JLNsAfnJNTGkGd3MBz3FonQQYKPxAuWMkH7s7PJOJRyl-_eCRkvkRsZKT4rbSId6-SZUkPwDhi7tbzSpwwkB_sHfVEL22LPpsSyJVQPUptRYUzDs6TETkalYwcakC7PzdzpgBFcN-bmpTqY7WxYaRnHTP_tlMfrBTTbNSOPQ0wf-w_uRFk951p0EsfmaamAzH3KRWUuD29lNN_4o1DE_bY4m3-DA1VkXCQQqMJtLWsh-h5Lngf-R6LOqOyjCbRqOml3cdviax6c7zkO7RxqSYYwJEuGYuk5tCcXZTmbsqPIjgONISds5ebfqJiUr6Un5_UsA0VMlZNnIQTdvSoxwPksIkT02o_yoZbSQft